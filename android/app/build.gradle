apply plugin: 'com.android.application'

android {
    namespace = "com.thayllon.privatecontrol"
    compileSdk = rootProject.ext.compileSdkVersion

    def resolvedVersionCode = (project.findProperty("ANDROID_VERSION_CODE") ?: System.getenv("ANDROID_VERSION_CODE") ?: "2").toInteger()
    def resolvedVersionName = (project.findProperty("ANDROID_VERSION_NAME") ?: System.getenv("ANDROID_VERSION_NAME") ?: "1.1.0").toString()
    def customDebugKeystorePath = (project.findProperty("ANDROID_DEBUG_KEYSTORE_PATH") ?: System.getenv("ANDROID_DEBUG_KEYSTORE_PATH") ?: "").toString()
    def customReleaseKeystorePath = (project.findProperty("ANDROID_KEYSTORE_PATH") ?: System.getenv("ANDROID_KEYSTORE_PATH") ?: "").toString()

    signingConfigs {
        if (customDebugKeystorePath && file(customDebugKeystorePath).exists()) {
            debug {
                storeFile file(customDebugKeystorePath)
                storePassword((project.findProperty("ANDROID_DEBUG_STORE_PASSWORD") ?: System.getenv("ANDROID_DEBUG_STORE_PASSWORD") ?: "android").toString())
                keyAlias((project.findProperty("ANDROID_DEBUG_KEY_ALIAS") ?: System.getenv("ANDROID_DEBUG_KEY_ALIAS") ?: "androiddebugkey").toString())
                keyPassword((project.findProperty("ANDROID_DEBUG_KEY_PASSWORD") ?: System.getenv("ANDROID_DEBUG_KEY_PASSWORD") ?: "android").toString())
            }
        }
        if (customReleaseKeystorePath && file(customReleaseKeystorePath).exists()) {
            release {
                storeFile file(customReleaseKeystorePath)
                storePassword((project.findProperty("ANDROID_KEYSTORE_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: "").toString())
                keyAlias((project.findProperty("ANDROID_KEY_ALIAS") ?: System.getenv("ANDROID_KEY_ALIAS") ?: "").toString())
                keyPassword((project.findProperty("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEY_PASSWORD") ?: "").toString())
            }
        }
    }

    defaultConfig {
        applicationId "com.thayllon.privatecontrol"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (signingConfigs.findByName("debug") != null) {
                signingConfig signingConfigs.debug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            } else if (signingConfigs.findByName("debug") != null) {
                signingConfig signingConfigs.debug
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
