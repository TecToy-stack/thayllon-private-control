name: Build Android APK (Thayllon Private Control)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'URL HTTPS do servidor backend (opcional, para sincronização pós-reinstalação)'
        required: false
        default: ''
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java JDK 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm install

      - name: Compilar bundle Web (dist/) e sincronizar Capacitor Android
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || '' }}
        run: |
          npm run build:web
          npx cap sync android

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar app-debug.apk
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Preparar arquivo instalável (thayllon-private-control-debug.apk)
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/thayllon-private-control-debug.apk

      - name: Publicar APK nos Artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: thayllon-private-control-android-apk
          path: release-apks/thayllon-private-control-debug.apk
          retention-days: 30
